<style>
/* ---------- colour tokens (light shade of the site's maroon / rose) ---------- */
.team-s{
  --m:#7a2140; --m2:#5f1830; --m3:#8b2e48; --p:#d98b96; --pl:#f7e7ea; --mut:#7d5a64;
  --f:'Outfit','Segoe UI',system-ui,sans-serif; --ease:cubic-bezier(.2,.7,.2,1);
  font-family:var(--f); color:var(--m2); padding:80px 0 30px; overflow:hidden;
  background:linear-gradient(160deg,#fff8f9 0%,#f9e9ec 50%,#f3d6dc 100%);
}
.team-s *{box-sizing:border-box}
.team-s .th{padding:0 6vw}
.team-s h3{color:var(--m);font-weight:500;font-size:clamp(28px,3vw,44px);margin:0 0 10px;letter-spacing:-.01em}
.team-s .th p{color:var(--mut);font-weight:300;max-width:60ch;margin:0}

/* ---------- carousel ---------- */
.carousel{--height:clamp(460px,calc(80vh - 50px),680px);--width:450px;display:grid;transform:translate3d(0,0,.1px)}
.carousel__list{display:flex;overflow:hidden;list-style:none;padding:1em 0 3em;margin:0;contain:layout;isolation:isolate}
.carousel__item{display:grid;position:relative;align-content:start;margin:0 10px;padding:0;flex:1 1 10%;height:var(--height);overflow:hidden;
  background:linear-gradient(160deg,#f2c4cd,#d98b96);border-radius:16px;transform:translate3d(0,0,.1px);cursor:pointer;
  box-shadow:rgba(122,33,64,.22) 0 3px 15px 2px,rgba(122,33,64,.14) 0 12px 28px 0,rgba(122,33,64,.08) 0 2px 4px 0,rgba(255,255,255,.6) 0 0 0 1px inset;contain:layout;isolation:isolate}
.carousel__item,.carousel__item *{transition:all .6s cubic-bezier(.55,.24,.18,1);user-select:none}
.carousel__image,.carousel__contents{width:var(--width);height:auto}
.carousel__item:hover{flex-basis:calc(var(--width)/2);transition:all .3s ease}
.carousel__item[data-active]{flex-basis:var(--width);flex-grow:0}
@media screen and (max-width:800px){.carousel__item{flex-basis:15%}}
@media screen and (max-width:600px){
  .carousel__item{flex-basis:10%;margin:0 5px;border-radius:8px;font-size:3vw}
  .carousel__item[data-active]{flex-basis:45%;flex-grow:0}
  .carousel__item:nth-child(3),.carousel__item:nth-child(7){flex:0 0 10px}
  .carousel__item:nth-child(2),.carousel__item:nth-child(8){flex:0 0 5px;transform:translateX(-50px)}
  .carousel__item:nth-child(8){transform:translateX(50px)}
  .carousel__item:nth-child(1),.carousel__item:nth-child(n+9){flex:0 0 0;margin:0;box-shadow:none;opacity:0!important}
  .carousel__item:not(:nth-child(n+5)) img,.carousel__item:nth-child(n+7) img{opacity:.8}
  .carousel__item:not(:nth-child(n+4)) *,.carousel__item:nth-child(n+7) *{opacity:0!important}}
@media screen and (min-width:600px){
  .carousel__item:nth-child(3),.carousel__item:nth-child(10){flex:0 0 10px}
  .carousel__item:nth-child(2),.carousel__item:nth-child(11){flex:0 0 5px;transform:translateX(-50px)}
  .carousel__item:nth-child(11){transform:translateX(50px)}
  .carousel__item:nth-child(1),.carousel__item:nth-child(n+12){flex:0 0 0;margin:0;box-shadow:none;opacity:0!important}
  .carousel__item:not(:nth-child(n+5)) img,.carousel__item:nth-child(n+9) img{opacity:.8}
  .carousel__item:not(:nth-child(n+4)) *,.carousel__item:nth-child(n+10) *{opacity:0!important}}
.carousel__item img{display:block;position:absolute;width:var(--width);height:100%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1;aspect-ratio:2/3;object-fit:cover;filter:saturate(.3) contrast(.8) brightness(1.12)}
/* light rose tint over inactive cards; slides away on the active card */
.carousel__item::after{content:"";position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:1;background:linear-gradient(160deg,rgba(255,240,243,0) 35%,rgba(240,182,193,.55) 70%,rgba(217,139,150,.85) 100%);transition:all .66s cubic-bezier(.55,.24,.18,1)}
.carousel__item[data-active]::after{transform:translateY(100%)}
.carousel__item[data-active],.carousel__item[data-active] *{opacity:1;filter:none}
.carousel__contents{display:flex;flex-direction:column-reverse;justify-content:start;min-height:200px;padding:1em;z-index:2;background-image:radial-gradient(ellipse at 0 0,rgba(95,24,48,.6) 20%,transparent 50%);background-size:170% 200px;background-repeat:no-repeat;position:absolute;top:0;left:0}
.carousel__contents .user__name{color:#fff;font-size:1.75em;font-weight:600;letter-spacing:.8px;text-shadow:0 1px 2px rgba(60,10,25,.4)}
.carousel__contents .user__title{font-family:var(--f);font-size:.875em;letter-spacing:1.25px;font-weight:500;text-transform:uppercase;color:transparent;background:linear-gradient(270deg,#ffe3e8,#ffc2cd);background-clip:text;-webkit-background-clip:text;opacity:.95;text-wrap:balance;margin-bottom:.5em}
.carousel__contents .user__title,.carousel__contents .user__name{margin:0;line-height:1.1;opacity:0;transform:translateX(-200px);transition-duration:1s;max-width:18em}
@media screen and (max-width:800px){
  .carousel__item img{width:calc(var(--width)*.5)}
  .carousel__contents{transform:translateX(-100%) rotate(90deg);transform-origin:bottom right;align-items:end;justify-content:end;background-image:radial-gradient(ellipse at 100% 100%,rgba(95,24,48,.6) 0,transparent 50%);background-position:-100% 100%;flex-direction:column;position:absolute;bottom:0;left:0;text-align:right}
  [data-active] .carousel__contents{background-position:100% 100%}
  .carousel__contents .user__title,.carousel__contents .user__name{max-width:70vh;transform:translateX(200px)}}
[data-active] .carousel__contents *{transform:translateX(0);transition-duration:.66s;opacity:1}
[data-active] .carousel__contents .user__name{transition-delay:.1s}
[data-active] .carousel__contents .user__title{opacity:.95;transition-delay:.05s}

/* ---------- prev / next buttons ---------- */
.carousel__nav{padding:1em 6vw;justify-self:end;grid-row:1;display:flex;justify-content:space-between;gap:1em}
.carousel__nav button{display:flex;align-items:center;gap:.6em;padding:.6em 1.5em;border-radius:99px;cursor:pointer;font:500 1rem var(--f);color:#fff;background:linear-gradient(135deg,var(--m3),var(--m));border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(122,33,64,.25);transition:.3s var(--ease)}
.carousel__nav button:hover{background:#fff;color:var(--m);transform:translateY(-3px);box-shadow:0 12px 26px rgba(122,33,64,.3)}
.carousel__nav button svg{fill:none;width:22px;height:22px;margin:0;padding:0}
.carousel__nav button span{margin:0;padding:0}
.carousel__nav button path{fill:currentColor}
</style>

  const activateSlide = ($s, focus) => {
